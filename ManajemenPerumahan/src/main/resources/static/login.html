<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AdmajaMajesti- Masuk / Daftar</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #F1F5F9;
      background-image: radial-gradient(circle, rgba(124,58,237,0.07) 1px, transparent 1px);
      background-size: 24px 24px;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
      color: #1e1b4b;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .card {
      background: #fff;
      border-radius: 20px;
      border: 1px solid rgba(124,58,237,0.1);
      box-shadow: 0 4px 32px rgba(124,58,237,0.08), 0 1px 4px rgba(0,0,0,0.04);
      padding: 2.25rem 2rem;
      width: 100%;
      max-width: 420px;
      animation: fadeUp 480ms ease both;
    }

    /* ── Logo ── */
    .logo-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-bottom: 1.5rem;
    }
    .logo-icon {
      width: 48px; height: 48px;
      border-radius: 50%;
      background: rgba(124,58,237,0.08);
      border: 1.5px solid rgba(124,58,237,0.2);
      display: flex; align-items: center; justify-content: center;
      font-size: 22px;
    }
    .brand-name {
      font-size: 22px; font-weight: 800;
      letter-spacing: -0.5px; color: #1e1b4b;
      line-height: 1;
    }
    .brand-name span { color: #7C3AED; }
    .brand-sub {
      font-size: 10px; font-weight: 700;
      color: #94a3b8; letter-spacing: 0.12em;
      text-transform: uppercase; margin-top: 4px;
    }

    .divider-top {
      height: 1px;
      background: linear-gradient(to right, transparent, rgba(124,58,237,0.15), transparent);
      margin-bottom: 1.5rem;
    }

    /* ── Heading ── */
    h1 {
      font-size: 22px; font-weight: 800;
      color: #1e1b4b; text-align: center;
      margin-bottom: 4px;
    }
    .subtitle {
      font-size: 13.5px; color: #64748b;
      text-align: center; margin-bottom: 1.5rem;
    }

    /* ── Status message ── */
    .status {
      display: none;
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 13px; font-weight: 600;
      text-align: center;
      margin-bottom: 1rem;
    }
    .status.error {
      background: rgba(220,38,38,0.06);
      border: 1px solid rgba(220,38,38,0.2);
      color: #b91c1c;
    }
    .status.success {
      background: rgba(124,58,237,0.07);
      border: 1px solid rgba(124,58,237,0.2);
      color: #6D28D9;
    }

    /* ── Fields ── */
    .field { margin-bottom: 1rem; }
    .field label {
      display: block;
      font-size: 11px; font-weight: 700;
      color: #94a3b8; letter-spacing: 0.1em;
      text-transform: uppercase; margin-bottom: 6px;
    }

    /* ************************************************************ */
    /* *** MODIFIKASI: Penataan Kontainer dan Ikon Dalam Kolom *** */
    /* ************************************************************ */

    /* 1. Gaya Kontainer Utama (Sekarang yang memiliki Border & Background) */
    .input-wrap {
      display: flex; /* Menggunakan Flexbox untuk menjajajarkan ikon dan teks */
      align-items: center;
      background: #F8FAFC;
      border: 1.5px solid #e2e8f0;
      border-radius: 12px;
      transition: border-color 0.18s, box-shadow 0.18s, background 0.18s;
      position: relative; /* Tetap perlu untuk posisi absolut mata */
    }

    /* 2. Menghapus Gaya dari Elemen Input (Sekarang Transparan) */
    input[type="email"],
    input[type="password"],
    input[type="text"] {
      flex: 1; /* Input mengambil sisa ruang yang ada di flex container */
      width: 100%;
      background: transparent; /* Transparan */
      border: none; /* Tanpa Border */
      border-radius: inherit; /* Ikuti border-radius pembungkusnya */
      padding: 11px 14px 11px 12px; /* Padding kiri disesuaikan untuk alignment */
      font-size: 14px; font-weight: 600;
      color: #1e1b4b; font-family: inherit;
      outline: none; /* outline dihapus dari input, fokus ditangani container */
    }
    input[type="email"]::placeholder,
    input[type="password"]::placeholder,
    input[type="text"]::placeholder {
      color: #cbd5e1; font-weight: 500;
    }

    /* 3. Gaya Ikon Kiri (Mail, User, Lock) */
    .input-wrap .ti.left-icon {
      padding-left: 14px; /* Space di kiri ikon */
      font-size: 15px; color: #94a3b8; pointer-events: none;
      flex-shrink: 0; /* Ikon tidak mengecil */
      width: 32px; /* Lebar tetap untuk alignment yang rapi */
      text-align: center;
    }

    /* 4. Gaya Fokus pada Kontainer (Menangani Status Fokus Input di dalamnya) */
    .input-wrap:focus-within {
      border-color: #7C3AED;
      background: #fff;
      box-shadow: 0 0 0 4px rgba(124,58,237,0.12);
    }

    /* 5. Gaya Ikon Mata (Tetap Absolut, Tapi Posisi 'right' Diperbaiki) */
    .has-toggle input { padding-right: 44px; } /* Jarak di kanan teks untuk mata */

    .eye-btn {
      position: absolute;
      right: 12px; /* Jarak tetap di dalam field column visual */
      top: 50%;
      transform: translateY(-50%);
      background: none; border: none; cursor: pointer;
      color: #94a3b8; font-size: 15px; padding: 4px;
      transition: color 0.15s;
      line-height: 1;
    }
    .eye-btn:hover { color: #7C3AED; }

    /* ************************************************************ */
    /* ************************************************************ */

    /* ── Remember / Forgot row ── */
    .row-spaced {
      display: flex; align-items: center;
      justify-content: space-between;
      margin-bottom: 1.25rem;
    }
    .check-label {
      display: flex; align-items: center; gap: 8px;
      font-size: 13px; font-weight: 600; color: #475569;
      cursor: pointer; user-select: none;
    }
    .check-label input[type="checkbox"] {
      width: 15px; height: 15px;
      accent-color: #7C3AED; cursor: pointer;
    }
    .forgot {
      font-size: 13px; font-weight: 700;
      color: #7C3AED; text-decoration: none;
      transition: color 0.15s;
    }
    .forgot:hover { color: #6D28D9; }

    /* ── Buttons ── */
    .btn-primary {
      width: 100%; padding: 13px;
      background: #7C3AED;
      color: #fff; font-size: 14.5px; font-weight: 800;
      border: none; border-radius: 12px; cursor: pointer;
      font-family: inherit; letter-spacing: 0.01em;
      transition: background 0.18s, transform 0.15s, box-shadow 0.18s;
      box-shadow: 0 4px 16px rgba(124,58,237,0.28);
      margin-bottom: 1rem;
    }
    .btn-primary:hover {
      background: #6D28D9;
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(124,58,237,0.32);
    }
    .btn-primary:active { transform: translateY(0); }

    .or-divider {
      display: flex; align-items: center; gap: 12px;
      margin-bottom: 1rem;
    }
    .or-divider hr {
      flex: 1; height: 1px;
      border: none; background: #e2e8f0;
    }
    .or-divider span {
      font-size: 11px; font-weight: 700;
      color: #94a3b8; letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .btn-google {
      width: 100%; padding: 12px;
      background: #fff;
      border: 1.5px solid #e2e8f0;
      border-radius: 12px; cursor: pointer;
      font-size: 13.5px; font-weight: 700;
      color: #334155; font-family: inherit;
      display: flex; align-items: center;
      justify-content: center; gap: 10px;
      transition: background 0.15s, border-color 0.15s, transform 0.15s;
      margin-bottom: 1.5rem;
    }
    .btn-google:hover {
      background: #F8FAFC;
      border-color: #cbd5e1;
      transform: translateY(-1px);
    }
    .btn-google:active { transform: translateY(0); }

    /* ── Footer ── */
    .footer {
      text-align: center;
      font-size: 13px; font-weight: 600; color: #64748b;
    }
    .footer a {
      color: #7C3AED; font-weight: 800;
      text-decoration: none;
      cursor: pointer;
    }
    .footer a:hover { color: #6D28D9; }

    /* Form Animation */
    .form-container {
      animation: fadeUp 300ms ease both;
    }
  </style>
</head>

<body>
  <div class="card">
    <div class="logo-wrap">
      <div class="logo-icon" aria-hidden="true" style="background: linear-gradient(135deg, #8b5cf6, #d946ef); border: none; color: white; box-shadow: 0 8px 20px rgba(168, 85, 247, 0.4); display: flex; align-items: center; justify-content: center;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
          <path d="M6 20h12V4H6v16zm2-12h2v2H8V8zm4 0h2v2h-2V8zm-4 4h2v2H8v-2zm4 0h2v2h-2v-2zm-2 8h-2v-3h2v3z"/>
        </svg>
      </div>
      <div style="display: flex; flex-direction: column; justify-content: center;">
        <div class="brand-name" style="color: #0f172a;">Admaja<span style="color: #7c3aed;">Majesti</span></div>
        <div class="brand-sub" style="font-size: 8.5px; letter-spacing: 0.05em; color: #64748b; margin-top: 2px;">PT. ADMAJA PROPERTI GRAHA MAJESTI</div>
      </div>
    </div>

    <div class="divider-top"></div>

    <h1 id="form-title">Masuk ke Akun Anda</h1>
    <p class="subtitle" id="form-subtitle">Kelola properti Anda dengan mudah</p>

    <div class="status" id="status"></div>

    <div id="login-section" class="form-container">
      <div class="field">
        <label for="login-email">Username</label>
        <div class="input-wrap">
          <i class="ti ti-mail left-icon" aria-hidden="true"></i>
          <input type="email" id="login-email" placeholder="nama@contoh.com" autocomplete="email" />
        </div>
      </div>

      <div class="field">
        <label for="login-password">Kata Sandi</label>
        <div class="input-wrap has-toggle">
          <i class="ti ti-lock left-icon" aria-hidden="true"></i>
          <input type="password" id="login-password" placeholder="Masukkan kata sandi" autocomplete="current-password" />
          <button class="eye-btn" type="button" aria-label="Toggle kata sandi">
            <i class="ti ti-eye"></i>
          </button>
        </div>
      </div>

      <div class="row-spaced">
        <label class="check-label">
          <input type="checkbox" id="remember" />
          Ingat Saya
        </label>
        <a href="#" class="forgot">Lupa Kata Sandi?</a>
      </div>

      <button class="btn-primary" id="btn-login" type="button">Masuk</button>

      <div class="or-divider">
        <hr /><span>atau</span><hr />
      </div>

      <button class="btn-google" type="button">
        <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true">
          <path fill="#FFC107" d="M43.6 20.1H42V20H24v8h11.3c-1 2.9-3.7 5-7 5-4 0-7.3-3.3-7.3-7.3s3.3-7.3 7.3-7.3c1.9 0 3.6.7 4.9 1.9l5.7-5.7C35.6 11.6 30.1 9 24 9 13.5 9 5 17.5 5 28s8.5 19 19 19c10.1 0 18.6-7.9 18.6-19 0-1.3-.1-2.6-.4-3.9z"/>
          <path fill="#FF3D00" d="M6.3 15.7l6.6 4.8C14.6 17.5 19 14.7 24 14.7c2.6 0 5 .9 6.8 2.4l5.7-5.7C33.1 8.8 28.9 7 24 7 16.3 7 9.5 10.4 6.3 15.7z"/>
          <path fill="#4CAF50" d="M24 43c4.9 0 9.3-1.8 12.7-4.8l-5.9-5c-2 1.4-4.5 2.3-6.8 2.3-3.3 0-6-2.1-7-5H5.6l-1.4 1C7.5 39.1 15.2 43 24 43z"/>
          <path fill="#1976D2" d="M43.6 20.1H42V20H24v8h11.3c-.5 1.4-1.4 2.7-2.5 3.7l5.9 5C42.8 33.5 44 31 44 28c0-2.7-.5-5.3-1.4-7.6l1-.3z"/>
        </svg>
        Masuk dengan Google
      </button>

      <div class="footer">
        Belum punya akun? <a id="link-to-register">Daftar Sekarang</a>
      </div>
    </div>

    <div id="register-section" class="form-container" style="display: none;">
      <div class="field">
        <label for="reg-name">Nama Lengkap</label>
        <div class="input-wrap">
          <i class="ti ti-user left-icon" aria-hidden="true"></i>
          <input type="text" id="reg-name" placeholder="Masukkan nama lengkap Anda" />
        </div>
      </div>

      <div class="field">
        <label for="reg-email">Email</label>
        <div class="input-wrap">
          <i class="ti ti-mail left-icon" aria-hidden="true"></i>
          <input type="email" id="reg-email" placeholder="nama@contoh.com" autocomplete="email" />
        </div>
      </div>

      <div class="field">
        <label for="reg-password">Kata Sandi Baru</label>
        <div class="input-wrap has-toggle">
          <i class="ti ti-lock left-icon" aria-hidden="true"></i>
          <input type="password" id="reg-password" placeholder="Buat kata sandi yang kuat" />
          <button class="eye-btn" type="button" aria-label="Toggle kata sandi">
            <i class="ti ti-eye"></i>
          </button>
        </div>
      </div>

      <button class="btn-primary" id="btn-register" type="button" style="margin-top: 1rem;">Daftar Akun</button>

      <div class="or-divider">
        <hr /><span>atau</span><hr />
      </div>

      <button class="btn-google" type="button">
        <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true">
          <path fill="#FFC107" d="M43.6 20.1H42V20H24v8h11.3c-1 2.9-3.7 5-7 5-4 0-7.3-3.3-7.3-7.3s3.3-7.3 7.3-7.3c1.9 0 3.6.7 4.9 1.9l5.7-5.7C35.6 11.6 30.1 9 24 9 13.5 9 5 17.5 5 28s8.5 19 19 19c10.1 0 18.6-7.9 18.6-19 0-1.3-.1-2.6-.4-3.9z"/>
          <path fill="#FF3D00" d="M6.3 15.7l6.6 4.8C14.6 17.5 19 14.7 24 14.7c2.6 0 5 .9 6.8 2.4l5.7-5.7C33.1 8.8 28.9 7 24 7 16.3 7 9.5 10.4 6.3 15.7z"/>
          <path fill="#4CAF50" d="M24 43c4.9 0 9.3-1.8 12.7-4.8l-5.9-5c-2 1.4-4.5 2.3-6.8 2.3-3.3 0-6-2.1-7-5H5.6l-1.4 1C7.5 39.1 15.2 43 24 43z"/>
          <path fill="#1976D2" d="M43.6 20.1H42V20H24v8h11.3c-.5 1.4-1.4 2.7-2.5 3.7l5.9 5C42.8 33.5 44 31 44 28c0-2.7-.5-5.3-1.4-7.6l1-.3z"/>
        </svg>
        Daftar dengan Google
      </button>

      <div class="footer">
        Sudah punya akun? <a id="link-to-login">Masuk di sini</a>
      </div>
    </div>

  </div>

  <script>
    // --- Referensi Elemen ---
    const loginSection = document.getElementById('login-section');
    const registerSection = document.getElementById('register-section');
    const formTitle = document.getElementById('form-title');
    const formSubtitle = document.getElementById('form-subtitle');
    const statusEl = document.getElementById('status');

    const linkToRegister = document.getElementById('link-to-register');
    const linkToLogin = document.getElementById('link-to-login');

    // --- Logika Toggle Tampilan (Masuk <-> Daftar) ---
    function hideStatus() {
      statusEl.style.display = 'none';
      statusEl.className = 'status';
    }

    linkToRegister.addEventListener('click', () => {
      hideStatus();
      loginSection.style.display = 'none';
      registerSection.style.display = 'block';
      formTitle.textContent = 'Daftar Akun Baru';
      formSubtitle.textContent = 'Bergabunglah dengan PerumahanPro';
    });

    linkToLogin.addEventListener('click', () => {
      hideStatus();
      registerSection.style.display = 'none';
      loginSection.style.display = 'block';
      formTitle.textContent = 'Masuk ke Akun Anda';
      formSubtitle.textContent = 'Kelola properti Anda dengan mudah';
    });

    // --- Logika Toggle Ikon Mata (Password) Dinamis ---
    document.querySelectorAll('.eye-btn').forEach(btn => {
      btn.addEventListener('click', function() {
        const input = this.previousElementSibling;
        const icon = this.querySelector('i');
        
        if (input.type === 'password') {
          input.type = 'text';
          icon.className = 'ti ti-eye-off';
        } else {
          input.type = 'password';
          icon.className = 'ti ti-eye';
        }
      });
    });

    // =======================================================
    // --- LOGIKA UTAMA: API LOGIN KE SPRING BOOT ---
    // =======================================================
    document.getElementById('btn-login').addEventListener('click', async () => {
      const usernameVal = document.getElementById('login-email').value.trim();
      const passVal  = document.getElementById('login-password').value;

      if (!usernameVal || !passVal) {
        statusEl.className = 'status error';
        statusEl.textContent = 'Harap isi Username dan Kata Sandi terlebih dahulu.';
        statusEl.style.display = 'block';
        return;
      }

      // Menampilkan animasi loading bawaanmu
      statusEl.className = 'status success';
      statusEl.textContent = 'Memproses otentikasi...';
      statusEl.style.display = 'block';

      try {
        // "Mengetuk" pintu AuthController di Spring Boot
        const response = await fetch('http://localhost:8080/api/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username: usernameVal, password: passVal })
        });
        
        const resultText = await response.text();

        if (resultText.includes("Sukses")) {
            // Ambil Role (ADMIN / USER) dari balasan server
            const roleUser = resultText.split(": ")[1]; 
            
            // Simpan tiket sesi ke browser
            sessionStorage.setItem('isLoggedIn', 'true');
            sessionStorage.setItem('username', usernameVal);
            sessionStorage.setItem('role', roleUser);

            // Tampilkan pesan sukses
            statusEl.className = 'status success';
            statusEl.textContent = '✓ Berhasil masuk! Mengalihkan...';
            
            // ==========================================
            // PINTU GERBANG PINTAR (PERCABANGAN HALAMAN)
            // ==========================================
            setTimeout(() => {
                if (roleUser === 'ADMIN') {
                    // Jika Admin, arahkan ke halaman Dashboard Utama
                    window.location.href = 'dashboard.html'; 
                } else if (roleUser === 'USER') {
                    // Jika User/Pembeli, arahkan ke halaman Katalog
                    window.location.href = 'katalog.html'; 
                } else {
                    window.location.href = 'login.html';
                }
            }, 1000);

        } else {
            // Tampilkan pesan error langsung dari Spring Boot (Contoh: "Password salah!")
            statusEl.className = 'status error';
            statusEl.textContent = resultText;
        }

      } catch (error) {
        statusEl.className = 'status error';
        statusEl.textContent = 'Gagal terhubung ke server database.';
      }
    });

    // =======================================================
    // --- LOGIKA UTAMA: API DAFTAR KE SPRING BOOT ---
    // =======================================================
    document.getElementById('btn-register').addEventListener('click', async () => {
      const name  = document.getElementById('reg-name').value.trim();
      const email = document.getElementById('reg-email').value.trim();
      const pass  = document.getElementById('reg-password').value;

      if (!name || !email || !pass) {
        statusEl.className = 'status error';
        statusEl.textContent = 'Harap lengkapi semua data pendaftaran.';
        statusEl.style.display = 'block';
        return;
      }

      statusEl.className = 'status success';
      statusEl.textContent = 'Memproses pendaftaran...';
      statusEl.style.display = 'block';

      try {
        const response = await fetch('http://localhost:8080/api/auth/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ namaLengkap: name, username: email, password: pass })
        });

        const resultText = await response.text();

        // Jika respons dari Spring Boot adalah pesan "Sukses: ..."
        if (resultText.includes("Sukses")) {
            statusEl.className = 'status success';
            statusEl.textContent = resultText;
            
            // Kosongkan isian form
            document.getElementById('reg-name').value = '';
            document.getElementById('reg-email').value = '';
            document.getElementById('reg-password').value = '';

            // Otomatis pindah ke tampilan Login setelah 2 detik
            setTimeout(() => {
                linkToLogin.click();
            }, 2000);
        } else {
            // Jika gagal (contoh: email sudah dipakai)
            statusEl.className = 'status error';
            statusEl.textContent = resultText;
        }
      } catch (error) {
        statusEl.className = 'status error';
        statusEl.textContent = 'Gagal terhubung ke server database.';
      }
    });

    // =======================================================
    // --- LOGIKA LUPA KATA SANDI ---
    // =======================================================
    document.querySelector('.forgot').addEventListener('click', (e) => {
        e.preventDefault(); // Mencegah halaman refresh
        statusEl.className = 'status error'; 
        statusEl.textContent = 'Silakan hubungi Admin Pusat di WA (0889-xxxx) untuk mereset kata sandi Anda.';
        statusEl.style.display = 'block';
    });
  </script>
</body>
</html>
