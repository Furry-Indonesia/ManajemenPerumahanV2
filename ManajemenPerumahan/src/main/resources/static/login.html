<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AdmajaMajesti — Masuk / Daftar</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg-deep:    #0a0a12;
      --bg-mid:     #10101e;
      --accent:     #8b5cf6;
      --accent-glow:#a78bfa;
      --accent-dim: rgba(139,92,246,0.18);
      --gold:       #d4a853;
      --gold-light: #f0c775;
      --card-bg:    rgba(16,16,30,0.72);
      --border:     rgba(139,92,246,0.22);
      --text-main:  #f1f0ff;
      --text-sub:   #8b8aaa;
      --text-label: #6b6a8a;
      --input-bg:   rgba(255,255,255,0.04);
      --input-border: rgba(139,92,246,0.2);
      --error-bg:   rgba(239,68,68,0.1);
      --error-border: rgba(239,68,68,0.3);
      --error-text: #f87171;
      --success-bg: rgba(139,92,246,0.12);
      --success-border: rgba(139,92,246,0.35);
      --success-text: #c4b5fd;
    }

    /* ── Body & Background ── */
    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg-deep);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
      color: var(--text-main);
      overflow: hidden;
      position: relative;
    }

    /* ── Animated Background Canvas ── */
    #bg-canvas {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
    }

    /* ── Ambient Light Orbs ── */
    .orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(90px);
      pointer-events: none;
      z-index: 0;
      animation: orbFloat linear infinite;
    }
    .orb-1 {
      width: 480px; height: 480px;
      background: radial-gradient(circle, rgba(109,40,217,0.28) 0%, transparent 70%);
      top: -180px; left: -140px;
      animation-duration: 22s;
    }
    .orb-2 {
      width: 360px; height: 360px;
      background: radial-gradient(circle, rgba(168,85,247,0.18) 0%, transparent 70%);
      bottom: -120px; right: -100px;
      animation-duration: 28s;
      animation-direction: reverse;
    }
    .orb-3 {
      width: 260px; height: 260px;
      background: radial-gradient(circle, rgba(212,168,83,0.1) 0%, transparent 70%);
      top: 50%; left: 60%;
      animation-duration: 18s;
    }
    @keyframes orbFloat {
      0%, 100% { transform: translate(0, 0) scale(1); }
      33%       { transform: translate(30px, -25px) scale(1.04); }
      66%       { transform: translate(-20px, 20px) scale(0.97); }
    }

    /* ── Grid Overlay ── */
    .grid-overlay {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(139,92,246,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(139,92,246,0.04) 1px, transparent 1px);
      background-size: 48px 48px;
      mask-image: radial-gradient(ellipse 80% 80% at 50% 50%, black 30%, transparent 100%);
    }

    /* ── Floating Particles ── */
    .particles {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
    }
    .particle {
      position: absolute;
      border-radius: 50%;
      animation: particleDrift linear infinite;
      opacity: 0;
    }
    @keyframes particleDrift {
      0%   { transform: translateY(100vh) translateX(0) scale(0); opacity: 0; }
      10%  { opacity: 1; }
      90%  { opacity: 0.6; }
      100% { transform: translateY(-20px) translateX(var(--drift)) scale(1); opacity: 0; }
    }

    /* ── Main Content Wrapper ── */
    .page-wrap {
      position: relative;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
    }

    /* ── Card ── */
    @keyframes cardReveal {
      from { opacity: 0; transform: translateY(32px) scale(0.97); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    .card {
      position: relative;
      background: var(--card-bg);
      backdrop-filter: blur(32px) saturate(1.5);
      -webkit-backdrop-filter: blur(32px) saturate(1.5);
      border-radius: 24px;
      border: 1px solid var(--border);
      box-shadow:
        0 0 0 1px rgba(255,255,255,0.03) inset,
        0 32px 80px rgba(0,0,0,0.6),
        0 0 60px rgba(109,40,217,0.12);
      padding: 2.5rem 2.25rem;
      width: 100%;
      max-width: 430px;
      animation: cardReveal 640ms cubic-bezier(0.22,1,0.36,1) both;
    }

    /* ── Card shimmer line ── */
    .card::before {
      content: '';
      position: absolute;
      top: 0; left: 10%; right: 10%;
      height: 1px;
      background: linear-gradient(to right, transparent, rgba(167,139,250,0.6), transparent);
      border-radius: 100%;
    }

    /* ── Logo ── */
    .logo-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      margin-bottom: 1.75rem;
    }
    .logo-icon {
      width: 50px; height: 50px;
      border-radius: 14px;
      background: linear-gradient(135deg, #7c3aed 0%, #a855f7 50%, #d946ef 100%);
      box-shadow: 0 8px 24px rgba(124,58,237,0.45), 0 0 0 1px rgba(255,255,255,0.08) inset;
      display: flex; align-items: center; justify-content: center;
      position: relative;
      overflow: hidden;
    }
    .logo-icon::after {
      content: '';
      position: absolute;
      top: 0; left: -100%;
      width: 60%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.18), transparent);
      animation: logoShine 4s ease infinite;
    }
    @keyframes logoShine {
      0%, 60%, 100% { left: -100%; }
      30% { left: 120%; }
    }

    .brand-wrap { display: flex; flex-direction: column; }
    .brand-name {
      font-family: 'Cormorant Garamond', serif;
      font-size: 26px; font-weight: 700;
      letter-spacing: 0.02em;
      color: var(--text-main);
      line-height: 1;
    }
    .brand-name span { color: var(--accent-glow); }
    .brand-sub {
      font-size: 8px; font-weight: 600;
      color: var(--text-label);
      letter-spacing: 0.14em;
      text-transform: uppercase;
      margin-top: 5px;
    }

    /* ── Gold divider ── */
    .divider-top {
      height: 1px;
      background: linear-gradient(to right, transparent, var(--gold), transparent);
      opacity: 0.3;
      margin-bottom: 1.75rem;
    }

    /* ── Heading ── */
    h1 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 26px; font-weight: 600;
      color: var(--text-main);
      text-align: center;
      margin-bottom: 5px;
      letter-spacing: 0.01em;
    }
    .subtitle {
      font-size: 13px;
      color: var(--text-sub);
      text-align: center;
      margin-bottom: 1.75rem;
    }

    /* ── Status ── */
    .status {
      display: none;
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 13px; font-weight: 600;
      text-align: center;
      margin-bottom: 1.1rem;
    }
    .status.error {
      background: var(--error-bg);
      border: 1px solid var(--error-border);
      color: var(--error-text);
    }
    .status.success {
      background: var(--success-bg);
      border: 1px solid var(--success-border);
      color: var(--success-text);
    }

    /* ── Fields ── */
    .field {
      margin-bottom: 1rem;
      animation: fieldSlide 400ms cubic-bezier(0.22,1,0.36,1) both;
    }
    .field:nth-child(1) { animation-delay: 60ms; }
    .field:nth-child(2) { animation-delay: 120ms; }
    .field:nth-child(3) { animation-delay: 180ms; }
    @keyframes fieldSlide {
      from { opacity: 0; transform: translateX(-10px); }
      to   { opacity: 1; transform: translateX(0); }
    }

    .field label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 10.5px; font-weight: 700;
      color: var(--text-label);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-bottom: 7px;
    }
    .field label::before {
      content: '';
      display: inline-block;
      width: 3px; height: 3px;
      border-radius: 50%;
      background: var(--gold);
    }

    /* ── Input Wrapper ── */
    .input-wrap {
      display: flex;
      align-items: center;
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      border-radius: 12px;
      transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
      position: relative;
      overflow: hidden;
    }
    .input-wrap::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(139,92,246,0.05) 0%, transparent 60%);
      pointer-events: none;
    }
    .input-wrap:focus-within {
      border-color: var(--accent);
      background: rgba(139,92,246,0.07);
      box-shadow: 0 0 0 3px rgba(139,92,246,0.15), 0 1px 8px rgba(139,92,246,0.12);
    }

    .input-wrap .ti.left-icon {
      padding-left: 14px;
      font-size: 15px;
      color: var(--text-label);
      pointer-events: none;
      flex-shrink: 0;
      width: 34px;
      text-align: center;
      transition: color 0.2s;
    }
    .input-wrap:focus-within .ti.left-icon {
      color: var(--accent-glow);
    }

    input[type="email"],
    input[type="password"],
    input[type="text"] {
      flex: 1;
      width: 100%;
      background: transparent;
      border: none;
      border-radius: inherit;
      padding: 12px 14px 12px 8px;
      font-size: 14px; font-weight: 500;
      color: var(--text-main);
      font-family: inherit;
      outline: none;
    }
    input[type="email"]::placeholder,
    input[type="password"]::placeholder,
    input[type="text"]::placeholder {
      color: rgba(139,138,170,0.45);
      font-weight: 400;
    }

    .has-toggle input { padding-right: 44px; }

    .eye-btn {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none; border: none; cursor: pointer;
      color: var(--text-label);
      font-size: 15px; padding: 4px;
      transition: color 0.15s;
      line-height: 1;
    }
    .eye-btn:hover { color: var(--accent-glow); }

    /* ── Row: Remember / Forgot ── */
    .row-spaced {
      display: flex; align-items: center;
      justify-content: space-between;
      margin-bottom: 1.4rem;
    }
    .check-label {
      display: flex; align-items: center; gap: 8px;
      font-size: 13px; font-weight: 500;
      color: var(--text-sub);
      cursor: pointer; user-select: none;
    }
    .check-label input[type="checkbox"] {
      width: 15px; height: 15px;
      accent-color: var(--accent);
      cursor: pointer;
    }
    .forgot {
      font-size: 13px; font-weight: 600;
      color: var(--gold-light);
      text-decoration: none;
      transition: color 0.15s;
    }
    .forgot:hover { color: var(--gold); }

    /* ── Primary Button ── */
    .btn-primary {
      position: relative;
      width: 100%; padding: 13.5px;
      background: linear-gradient(135deg, #6d28d9 0%, #7c3aed 50%, #8b5cf6 100%);
      color: #fff; font-size: 14.5px; font-weight: 700;
      border: none; border-radius: 12px; cursor: pointer;
      font-family: inherit; letter-spacing: 0.04em;
      transition: transform 0.18s, box-shadow 0.18s, filter 0.18s;
      box-shadow: 0 6px 24px rgba(109,40,217,0.45), 0 0 0 1px rgba(255,255,255,0.06) inset;
      margin-bottom: 1.1rem;
      overflow: hidden;
    }
    .btn-primary::before {
      content: '';
      position: absolute;
      top: 0; left: -120%;
      width: 60%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent);
      transition: left 0.5s ease;
    }
    .btn-primary:hover::before { left: 130%; }
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 32px rgba(109,40,217,0.55), 0 0 0 1px rgba(255,255,255,0.1) inset;
      filter: brightness(1.05);
    }
    .btn-primary:active { transform: translateY(0); }

    /* ── OR Divider ── */
    .or-divider {
      display: flex; align-items: center; gap: 12px;
      margin-bottom: 1.1rem;
    }
    .or-divider hr {
      flex: 1; height: 1px;
      border: none;
      background: linear-gradient(to right, transparent, rgba(139,92,246,0.2), transparent);
    }
    .or-divider span {
      font-size: 10.5px; font-weight: 700;
      color: var(--text-label);
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    /* ── Footer ── */
    .footer {
      text-align: center;
      font-size: 13px; font-weight: 500;
      color: var(--text-sub);
    }
    .footer a {
      color: var(--accent-glow);
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
      transition: color 0.15s;
      position: relative;
    }
    .footer a::after {
      content: '';
      position: absolute;
      bottom: -1px; left: 0; right: 0;
      height: 1px;
      background: var(--accent-glow);
      transform: scaleX(0);
      transition: transform 0.2s ease;
    }
    .footer a:hover::after { transform: scaleX(1); }
    .footer a:hover { color: var(--accent-glow); }

    /* ── Form Sections ── */
    .form-container {
      animation: formReveal 380ms cubic-bezier(0.22,1,0.36,1) both;
    }
    @keyframes formReveal {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── Decorative corner accents ── */
    .card-corner {
      position: absolute;
      width: 40px; height: 40px;
      pointer-events: none;
    }
    .card-corner-tl {
      top: 12px; left: 12px;
      border-top: 1.5px solid rgba(212,168,83,0.3);
      border-left: 1.5px solid rgba(212,168,83,0.3);
      border-top-left-radius: 6px;
    }
    .card-corner-br {
      bottom: 12px; right: 12px;
      border-bottom: 1.5px solid rgba(212,168,83,0.3);
      border-right: 1.5px solid rgba(212,168,83,0.3);
      border-bottom-right-radius: 6px;
    }

    /* ── Pulse ring on logo icon ── */
    @keyframes pulseRing {
      0%   { transform: scale(1);   opacity: 0.4; }
      60%  { transform: scale(1.6); opacity: 0; }
      100% { transform: scale(1.6); opacity: 0; }
    }
    .logo-pulse {
      position: absolute;
      inset: 0;
      border-radius: inherit;
      border: 1.5px solid rgba(139,92,246,0.5);
      animation: pulseRing 2.6s ease-out infinite;
      pointer-events: none;
    }
  </style>
</head>

<body>
  <!-- Background layers -->
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>
  <div class="grid-overlay"></div>
  <div class="particles" id="particles"></div>

  <div class="page-wrap">
    <div class="card">
      <!-- Decorative corners -->
      <div class="card-corner card-corner-tl"></div>
      <div class="card-corner card-corner-br"></div>

      <!-- Logo -->
      <div class="logo-wrap">
        <div style="position: relative;">
          <div class="logo-icon" aria-hidden="true">
            <div class="logo-pulse"></div>
            <svg width="22" height="22" viewBox="0 0 24 24" fill="white">
              <path d="M6 20h12V4H6v16zm2-12h2v2H8V8zm4 0h2v2h-2V8zm-4 4h2v2H8v-2zm4 0h2v2h-2v-2zm-2 8h-2v-3h2v3z"/>
            </svg>
          </div>
        </div>
        <div class="brand-wrap">
          <div class="brand-name">Admaja<span>Majesti</span></div>
          <div class="brand-sub">PT. Admaja Properti Graha Majesti</div>
        </div>
      </div>

      <div class="divider-top"></div>

      <h1 id="form-title">Masuk ke Akun Anda</h1>
      <p class="subtitle" id="form-subtitle">Kelola properti Anda dengan mudah</p>

      <div class="status" id="status"></div>

      <!-- ── LOGIN SECTION ── -->
      <div id="login-section" class="form-container">
        <div class="field">
          <label for="login-email">Username</label>
          <div class="input-wrap">
            <i class="ti ti-mail left-icon" aria-hidden="true"></i>
            <input type="email" id="login-email" placeholder="Masukkan username" autocomplete="email" />
          </div>
        </div>

        <div class="field">
          <label for="login-password">Kata Sandi</label>
          <div class="input-wrap has-toggle">
            <i class="ti ti-lock left-icon" aria-hidden="true"></i>
            <input type="password" id="login-password" placeholder="Masukkan kata sandi" autocomplete="current-password" />
            <button class="eye-btn" type="button" aria-label="Toggle kata sandi">
              <i class="ti ti-eye"></i>
            </button>
          </div>
        </div>

        <div class="row-spaced">
          <label class="check-label">
            <input type="checkbox" id="remember" />
            Ingat Saya
          </label>
          <a href="#" class="forgot">Lupa Kata Sandi?</a>
        </div>

        <button class="btn-primary" id="btn-login" type="button">Masuk</button>

        <div class="or-divider">
          <hr /><span>atau</span><hr />
        </div>

        <div class="footer">
          Belum punya akun? <a id="link-to-register">Daftar Sekarang</a>
        </div>
      </div>

      <!-- ── REGISTER SECTION ── -->
      <div id="register-section" class="form-container" style="display: none;">
        <div class="field">
          <label for="reg-name">Nama Lengkap</label>
          <div class="input-wrap">
            <i class="ti ti-user left-icon" aria-hidden="true"></i>
            <input type="text" id="reg-name" placeholder="Masukkan nama lengkap Anda" />
          </div>
        </div>

        <div class="field">
          <label for="reg-email">Username</label>
          <div class="input-wrap">
            <i class="ti ti-mail left-icon" aria-hidden="true"></i>
            <input type="email" id="reg-email" placeholder="Masukkan username" autocomplete="email" />
          </div>
        </div>

        <div class="field">
          <label for="reg-password">Kata Sandi Baru</label>
          <div class="input-wrap has-toggle">
            <i class="ti ti-lock left-icon" aria-hidden="true"></i>
            <input type="password" id="reg-password" placeholder="Buat kata sandi yang kuat" />
            <button class="eye-btn" type="button" aria-label="Toggle kata sandi">
              <i class="ti ti-eye"></i>
            </button>
          </div>
        </div>

        <button class="btn-primary" id="btn-register" type="button" style="margin-top: 1rem;">Daftar Akun</button>

        <div class="or-divider">
          <hr /><span>atau</span><hr />
        </div>

        <div class="footer">
          Sudah punya akun? <a id="link-to-login">Masuk di sini</a>
        </div>
      </div>
    </div>
  </div>

  <script src="js/login.js"></script>
  
</body>
</html>
